name: Board

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited, closed]
  issues:
    types: [closed]

permissions: {}

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Require the PROJECT_TOKEN secret
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::error::Add a PROJECT_TOKEN repository secret with access to the project board (see docs/architecture.md, CI/CD)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: 1
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const board = require("./.github/scripts/board.js");
            await board.moveItemsForEvent({ github, context, core });
