name: Feature proposal
description: Propose a new capability for the platform.
title: "[Feature]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a candidate, company, or contributor not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? How does it fit the application flow in `docs/product/requirements.md`?
    validations:
      required: true
  - type: textarea
    id: teaching
    attributes:
      label: How does it keep the reasoning visible?
      description: This project's principle is that AI explains rather than replaces. How does the feature honour that?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
