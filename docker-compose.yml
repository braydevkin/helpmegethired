name: helpmegethired

x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/api/Dockerfile
    target: development

x-database-url: &database-url postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_PORT:?}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api-image
    environment:
      DATABASE_URL: *database-url
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      NODE_ENV: development
      PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_PORT:?}
      DATABASE_URL: *database-url
    ports:
      - "${API_PORT:?}:3001"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "--eval", "fetch('http://localhost:3001/health').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      API_URL: http://api:3001
    ports:
      - "${WEB_PORT:?}:3000"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--eval", "fetch('http://localhost:3000/').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
